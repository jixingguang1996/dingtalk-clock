<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="打卡助手">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>打卡助手 · 科技风</title>
<style>
:root{
  --bg-0:#05070f;
  --bg-1:#0a0f1e;
  --bg-2:#0f1729;
  --bg-3:#151f36;
  --line:rgba(140,180,255,.14);
  --cyan:#39d7ff;
  --cyan-soft:rgba(57,215,255,.14);
  --violet:#8b7bff;
  --violet-soft:rgba(139,123,255,.14);
  --green:#3be6a6;
  --amber:#ffc857;
  --red:#ff6b81;
  --text-hi:#eaf2ff;
  --text-mid:#9fb0cc;
  --text-low:#5e6f8c;
  --font-clock:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Consolas,monospace;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  --r-lg:20px;
  --r-md:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font-body);
  color:var(--text-hi);
  background:var(--bg-0);
  background-image:
    radial-gradient(900px 500px at 85% -8%, rgba(57,215,255,.12), transparent 60%),
    radial-gradient(800px 500px at -10% 20%, rgba(139,123,255,.12), transparent 60%),
    linear-gradient(180deg,#0a0f1e 0%,#05070f 100%);
  background-attachment:fixed;
  min-height:100%;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
/* 背景网格 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(140,180,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(140,180,255,.035) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 78%);
}
.wrap{
  position:relative;z-index:1;
  max-width:480px;margin:0 auto;
  padding:0 16px calc(28px + env(safe-area-inset-bottom));
}
/* 顶部 */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(18px + env(safe-area-inset-top)) 0 14px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  display:grid;place-items:center;
  box-shadow:0 0 20px rgba(57,215,255,.35);
}
.logo svg{width:19px;height:19px}
.brand b{font-size:16px;font-weight:700;letter-spacing:.5px}
.brand small{display:block;font-size:11px;color:var(--text-low);font-weight:400}
.status-pill{
  display:flex;align-items:center;gap:7px;
  font-size:12px;color:var(--text-mid);
  padding:7px 11px;border:1px solid var(--line);border-radius:999px;
  background:var(--bg-2);
}
.status-pill i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.status-pill.off i{background:var(--text-low);box-shadow:none}
/* 卡片 */
.card{
  background:var(--bg-2);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:20px;
  margin-bottom:16px;
  backdrop-filter:blur(10px);
}
/* 时钟 hero */
.hero{text-align:center;padding:26px 20px 24px;overflow:hidden;position:relative}
.hero .eyebrow{font-size:12px;letter-spacing:.18em;color:var(--text-mid);text-transform:uppercase}
.clock{
  font-family:var(--font-clock);
  font-size:clamp(52px,16vw,68px);
  font-weight:600;letter-spacing:2px;
  margin:8px 0 2px;
  background:linear-gradient(180deg,#ffffff,var(--cyan) 130%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(57,215,255,.25);
  font-variant-numeric:tabular-nums;
}
.clock-date{font-size:13px;color:var(--text-mid)}
.countdown{
  margin:20px auto 0;max-width:320px;
  padding:14px 16px;border-radius:var(--r-md);
  background:var(--bg-3);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.countdown .lbl{font-size:12px;color:var(--text-mid);text-align:left}
.countdown .lbl b{display:block;font-size:15px;color:var(--text-hi);font-weight:600}
.countdown .num{
  font-family:var(--font-clock);font-size:26px;font-weight:600;color:var(--cyan);
  font-variant-numeric:tabular-nums;letter-spacing:1px;
}
/* 按钮 */
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:16px;border:0;border-radius:14px;
  font-family:var(--font-body);font-size:16px;font-weight:700;color:#03121a;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  cursor:pointer;transition:transform .12s ease,box-shadow .2s ease;
  box-shadow:0 6px 26px rgba(57,215,255,.3);
}
.btn:active{transform:scale(.97)}
.btn.ghost{
  background:transparent;color:var(--text-mid);border:1px solid var(--line);
  box-shadow:none;font-size:14px;font-weight:500;
}
/* 设置 */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-head h2{font-size:15px;font-weight:600;letter-spacing:.3px}
.sec-head .hint{font-size:11px;color:var(--text-low)}
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;color:var(--text-mid);margin-bottom:7px}
.field label em{font-style:normal;color:var(--cyan)}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=time]{
  width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;
  background:var(--bg-3);color:var(--text-hi);font-family:var(--font-clock);
  font-size:18px;text-align:center;color-scheme:dark;
}
input[type=time]:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
/* 工作日 chips */
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.chip{
  padding:11px 0;text-align:center;border-radius:11px;border:1px solid var(--line);
  background:var(--bg-3);color:var(--text-mid);font-size:13px;cursor:pointer;
  transition:.15s;user-select:none;
}
.chip.on{
  background:var(--cyan-soft);border-color:var(--cyan);color:var(--cyan);
  box-shadow:0 0 14px rgba(57,215,255,.15);
}
.chip.rest{color:var(--text-low)}
/* 开关 */
.switch-row{display:flex;align-items:center;justify-content:space-between}
.switch-row .txt b{display:block;font-size:14px;font-weight:600}
.switch-row .txt small{font-size:12px;color:var(--text-low)}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{
  position:absolute;inset:0;border-radius:999px;background:var(--bg-3);
  border:1px solid var(--line);transition:.2s;cursor:pointer;
}
.slider::before{
  content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;
  border-radius:50%;background:var(--text-low);transition:.2s;
}
.switch input:checked + .slider{background:var(--cyan-soft);border-color:var(--cyan)}
.switch input:checked + .slider::before{left:24px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head h2{font-size:15px;font-weight:600}
.cal-nav{display:flex;gap:8px}
.cal-nav button{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg-3);color:var(--text-mid);font-size:16px;cursor:pointer;
}
.cal-nav button:active{transform:scale(.92)}
.week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.week span{text-align:center;font-size:11px;color:var(--text-low);padding:6px 0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{
  aspect-ratio:1;display:grid;place-items:center;border-radius:10px;
  font-size:13px;color:var(--text-mid);position:relative;font-family:var(--font-clock);
}
.day.work{color:var(--text-hi)}
.day.off{color:var(--text-low);opacity:.55}
.day.today{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#03121a;font-weight:700}
.day.other{opacity:.28}
.day .dot{
  position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;
  background:var(--cyan);
}
/* 图例 */
.legend{display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--text-low)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:3px;display:inline-block}
/* 弹层 */
.modal-mask{
  position:fixed;inset:0;z-index:50;display:none;place-items:center;
  background:rgba(3,6,14,.7);backdrop-filter:blur(6px);padding:20px;
}
.modal-mask.show{display:grid}
.modal{
  width:100%;max-width:360px;padding:28px 22px;text-align:center;
  background:var(--bg-2);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 24px 80px rgba(0,0,0,.5);
  animation:pop .25s ease;
}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal .ring{
  width:64px;height:64px;margin:0 auto 16px;border-radius:50%;
  display:grid;place-items:center;font-size:30px;
  background:var(--cyan-soft);box-shadow:0 0 40px rgba(57,215,255,.3);
}
.modal h3{font-size:19px;margin-bottom:6px}
.modal p{font-size:13px;color:var(--text-mid);margin-bottom:20px}
.toast{
  position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--bg-3);border:1px solid var(--line);border-radius:12px;
  padding:12px 18px;font-size:13px;color:var(--text-hi);z-index:60;
  opacity:0;transition:.25s;white-space:nowrap;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;font-size:11px;color:var(--text-low);margin-top:6px;line-height:1.8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="#03121a" stroke-width="2"/><path d="M12 7v5l3.5 2" stroke="#03121a" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div><b>打卡助手</b><small>钉钉 · 自动打卡</small></div>
    </div>
    <div class="status-pill" id="statusPill"><i></i><span id="statusText">提醒已开启</span></div>
  </div>

  <div class="card hero">
    <div class="eyebrow">本地时间</div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="clock-date" id="clockDate">——</div>
    <div class="countdown">
      <div class="lbl">下次打卡<b id="nextLabel">—</b></div>
      <div class="num" id="nextCount">--:--:--</div>
    </div>
  </div>

  <button class="btn" id="goBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm4 11-5 3.5v-7L16 13Z" fill="#03121a"/></svg>
    去钉钉打卡
  </button>

  <div class="card" style="margin-top:16px">
    <div class="sec-head">
      <h2>打卡时间</h2>
      <span class="hint">统一应用到所有工作日</span>
    </div>
    <div class="time-row">
      <div class="field">
        <label>上班打卡 <em>On Duty</em></label>
        <input type="time" id="onDutyTime" value="09:00">
      </div>
      <div class="field">
        <label>下班打卡 <em>Off Duty</em></label>
        <input type="time" id="offDutyTime" value="18:00">
      </div>
    </div>
    <div class="field" style="margin-top:16px">
      <label>工作日</label>
      <div class="chips" id="workdayChips"></div>
    </div>
  </div>

  <div class="card">
    <div class="switch-row">
      <div class="txt"><b>到点提醒</b><small>到时间弹通知，点通知跳钉钉</small></div>
      <label class="switch"><input type="checkbox" id="remindToggle"><span class="slider"></span></label>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn ghost" id="testBtn" style="flex:1">测试提醒</button>
      <button class="btn ghost" id="notifyBtn" style="flex:1">开启通知</button>
    </div>
  </div>

  <div class="card">
    <div class="cal-head">
      <h2 id="calTitle">——</h2>
      <div class="cal-nav">
        <button id="prevBtn">‹</button>
        <button id="nextBtn">›</button>
      </div>
    </div>
    <div class="week">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="days" id="days"></div>
    <div class="legend">
      <span><i style="background:linear-gradient(135deg,var(--cyan),var(--violet))"></i>今天</span>
      <span><i style="background:var(--cyan)"></i>工作日</span>
      <span><i style="background:var(--bg-3);border:1px solid var(--line)"></i>休息</span>
    </div>
  </div>

  <footer>
    打卡提醒 · 到点本地通知，点击跳转钉钉<br>
    已开启钉钉「极速打卡」时，进入打卡范围可自动打卡
  </footer>
</div>

<div class="modal-mask" id="mask">
  <div class="modal">
    <div class="ring">⏰</div>
    <h3 id="modalTitle">该打卡了</h3>
    <p id="modalDesc">现在到了打卡时间</p>
    <button class="btn" id="modalGo">去钉钉打卡</button>
    <button class="btn ghost" id="modalClose" style="margin-top:10px">稍后提醒</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var WD = ["周一","周二","周三","周四","周五","周六","周日"];

  // ---------- 状态 ----------
  var state = {
    onDuty: "09:00",
    offDuty: "18:00",
    workdays: [1,2,3,4,5],   // 1=周一 ... 7=周日
    remind: true
  };
  function load(){
    try{
      var s = JSON.parse(localStorage.getItem("clockState"));
      if(s){ state = Object.assign(state, s); }
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem("clockState", JSON.stringify(state)); }catch(e){}
  }
  function pad(n){ return n<10 ? "0"+n : ""+n; }

  // ---------- 时间工具 ----------
  function isWorkday(d){
    // d: Date；周一=1 ... 周日=7
    var wd = ((d.getDay()+6)%7)+1;
    return state.workdays.indexOf(wd) >= 0;
  }
  function timeToMin(hhmm){
    var p = hhmm.split(":"); return parseInt(p[0],10)*60 + parseInt(p[1],10);
  }

  // ---------- 时钟 ----------
  function renderClock(){
    var d = new Date();
    $("clock").textContent = pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
    var wd = ((d.getDay()+6)%7)+1;
    $("clockDate").textContent = d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 · "+WD[wd-1];
  }

  // ---------- 下次打卡倒计时 ----------
  function nextEvent(){
    var now = new Date();
    var events = [
      {label:"上班打卡", min: timeToMin(state.onDuty)},
      {label:"下班打卡", min: timeToMin(state.offDuty)}
    ];
    // 未来 8 天扫描
    for(var off=0; off<8; off++){
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+off);
      if(!isWorkday(d)) continue;
      for(var i=0;i<events.length;i++){
        var t = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, events[i].min);
        if(t > now){
          return {label:events[i].label, time:t};
        }
      }
    }
    return null;
  }
  function renderCountdown(){
    var ev = nextEvent();
    if(!ev){
      $("nextLabel").textContent = "无排班";
      $("nextCount").textContent = "--:--:--";
      return;
    }
    $("nextLabel").textContent = ev.label;
    var diff = Math.max(0, ev.time - new Date());
    var h = Math.floor(diff/3600000);
    var m = Math.floor(diff/60000)%60;
    var s = Math.floor(diff/1000)%60;
    $("nextCount").textContent = pad(h)+":"+pad(m)+":"+pad(s);
  }

  // ---------- 提醒触发 ----------
  var fired = {};
  function fireReminder(kind, label){
    var d = new Date();
    var key = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
    if(fired[key+"_"+kind]) return;
    fired[key+"_"+kind] = true;
    // 弹层
    $("modalTitle").textContent = label+"时间到";
    $("modalDesc").textContent = "现在是 "+state[kind==="on"?"onDuty":"offDuty"]+"，该打卡了";
    $("mask").classList.add("show");
    // 系统通知
    sendNotification(label+"打卡提醒", "现在是 "+d.getHours()+":"+pad(d.getMinutes())+"，点击去钉钉打卡");
    toast(label+"提醒已触发");
  }
  function checkReminder(){
    if(!state.remind) return;
    var d = new Date();
    if(!isWorkday(d)) return;
    var hm = pad(d.getHours())+":"+pad(d.getMinutes());
    if(hm === state.onDuty) fireReminder("on", "上班");
    if(hm === state.offDuty) fireReminder("off", "下班");
  }

  // ---------- 通知 ----------
  function sendNotification(title, body){
    if("Notification" in window && Notification.permission === "granted"){
      try{
        var n = new Notification(title, { body: body, icon:"icon.svg" });
        n.onclick = function(){ window.focus(); openDingTalk(); n.close(); };
      }catch(e){}
    }
  }
  function requestNotify(){
    if(!("Notification" in window)){ toast("此浏览器不支持通知"); return; }
    Notification.requestPermission().then(function(p){
      if(p === "granted"){ toast("通知已开启"); }
      else{ toast("未授权通知，可在系统设置里开启"); }
    });
  }

  // ---------- 钉钉深链 ----------
  function openDingTalk(){
    var jumped = false;
    document.addEventListener("pagehide", function(){ jumped = true; }, {once:true});
    document.addEventListener("visibilitychange", function(){ if(document.hidden){ jumped = true; } }, {once:true});
    var a = document.createElement("a");
    a.href = "dingtalk://";
    a.rel = "noopener";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 300);
    setTimeout(function(){
      if(!jumped){ toast("未跳转：请确认在 iPhone 上已安装钉钉"); }
    }, 1300);
  }

  // ---------- 日历 ----------
  var calYear, calMonth;
  function renderCalendar(){
    var d = new Date();
    if(calYear===undefined){ calYear=d.getFullYear(); calMonth=d.getMonth(); }
    $("calTitle").textContent = calYear+"年"+(calMonth+1)+"月";
    var first = new Date(calYear, calMonth, 1);
    var startWeekday = (first.getDay()+6)%7; // 周一=0
    var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    var todayStr = d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
    var html = "";
    // 前置空白
    for(var i=0;i<startWeekday;i++){ html += '<div class="day other"></div>'; }
    for(var day=1; day<=daysInMonth; day++){
      var dd = new Date(calYear, calMonth, day);
      var isToday = (calYear+"-"+calMonth+"-"+day === todayStr);
      var work = isWorkday(dd);
      var cls = "day";
      cls += work ? " work" : " off";
      if(isToday) cls += " today";
      var dot = (work && !isToday) ? '<span class="dot"></span>' : "";
      html += '<div class="'+cls+'">'+day+dot+'</div>';
    }
    $("days").innerHTML = html;
  }

  // ---------- 设置 UI ----------
  function renderChips(){
    var html = "";
    for(var i=1;i<=7;i++){
      var on = state.workdays.indexOf(i)>=0;
      html += '<div class="chip'+(on?" on":" rest")+'" data-wd="'+i+'">'+WD[i-1].slice(1)+'</div>';
    }
    $("workdayChips").innerHTML = html;
  }
  function renderStatus(){
    var on = state.remind;
    $("statusPill").classList.toggle("off", !on);
    $("statusText").textContent = on ? "提醒已开启" : "提醒已关闭";
  }
  function bindSettings(){
    $("onDutyTime").addEventListener("change", function(){ state.onDuty = this.value; save(); });
    $("offDutyTime").addEventListener("change", function(){ state.offDuty = this.value; save(); });
    $("remindToggle").addEventListener("change", function(){ state.remind = this.checked; save(); renderStatus(); });
    $("workdayChips").addEventListener("click", function(e){
      var el = e.target.closest(".chip"); if(!el) return;
      var wd = parseInt(el.getAttribute("data-wd"),10);
      var idx = state.workdays.indexOf(wd);
      if(idx>=0){ state.workdays.splice(idx,1); } else { state.workdays.push(wd); }
      state.workdays.sort(function(a,b){return a-b;});
      save(); renderChips(); renderCalendar();
    });
  }

  // ---------- Toast ----------
  var toastTimer;
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  // ---------- 初始化 ----------
  function init(){
    load();
    $("onDutyTime").value = state.onDuty;
    $("offDutyTime").value = state.offDuty;
    $("remindToggle").checked = state.remind;
    renderChips();
    renderStatus();
    renderCalendar();
    renderClock();
    renderCountdown();
    bindSettings();

    $("goBtn").addEventListener("click", openDingTalk);
    $("modalGo").addEventListener("click", function(){ $("mask").classList.remove("show"); openDingTalk(); });
    $("modalClose").addEventListener("click", function(){ $("mask").classList.remove("show"); });
    $("notifyBtn").addEventListener("click", requestNotify);
    $("testBtn").addEventListener("click", function(){
      $("modalTitle").textContent = "测试提醒";
      $("modalDesc").textContent = "这是测试，正式会在设定时间自动触发";
      $("mask").classList.add("show");
      sendNotification("打卡助手测试", "到点提醒功能正常");
    });
    $("prevBtn").addEventListener("click", function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); });
    $("nextBtn").addEventListener("click", function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); });

    setInterval(function(){ renderClock(); renderCountdown(); checkReminder(); }, 1000);
  }

  // ---------- Service Worker ----------
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", init); }
  else{ init(); }
})();
</script>
</body>
</html>
